            background: #f1f5f9;

        }

            font-size: 22px;

        .badge {

            background-color: #e0e7ff;
            color: #4338ca;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #eaeaea;
        }
        .form-group {
            margin-bottom: 22px;
        }

            display: block;
            margin-bottom: 8px;

            font-size: 15px;

        }
        .required {

        }
        .form-group input {

            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;

        }
        .submit-btn {

            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;

            transition: background 0.2s;

        }

        }

<body>

<div class="container">

    </div>

    <div class="form-card">
        <form id="attendanceForm">
            
            <div class="form-group">
                <label><span class="required">*</span> البريد الإلكتروني</label>
                <input type="email" name="email" placeholder="example@gmail.com" required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> الاسم الكامل باللغة الانجليزية (كما سيكتب في الشهادة)</label>

                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> رقم الهاتف (للتواصل أو التنبيهات)</label>
                <input type="tel" name="phone" placeholder="07700000000" required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> المحافظة</label>
                <input type="text" name="city" placeholder="مثال: بغداد" required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> الجامعة / جهة العمل</label>
                <input type="text" name="university" placeholder="جامعة بغداد / مستشفى..." required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> المرحلة الدراسية أو سنة التخرج </label>
                <input type="text" name="stage" placeholder="مثال: المرحلة الرابعة / " required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">تسجيل الحضور الحضوري</button>
            <div id="loadingMsg">جاري إرسال البيانات وحفظها... ⏳</div>
        </form>
    </div>
</div>

<script>
    // جلب عنوان الورشة المحفوظ محلياً إن وجد
    const savedWorkshopTitle = localStorage.getItem('workshop_title_key');
    if (savedWorkshopTitle) {
        document.getElementById('workshopTitle').innerText = 'استمارة حضور ورشة: ' + savedWorkshopTitle;
    }

    // ضع رابط الـ Google Apps Script الخاص بالشيت الحضورية هنا بين العلامتين:
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyadeuFqm9VqYIBXx19niRkr4FBspwT9sxUsbSMB9ZSncB4HySEVuVTMLkRZy8zEyFD/exec';

    const form = document.getElementById('attendanceForm');
    const submitBtn = document.getElementById('submitBtn');
    const loadingMsg = document.getElementById('loadingMsg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        submitBtn.style.display = 'none';
        loadingMsg.style.display = 'block';

        const formData = new FormData(form);
        const dataObj = {};
        formData.forEach((value, key) => (dataObj[key] = value));
        dataObj['workshopName'] = document.getElementById('workshopTitle').innerText;
        dataObj['attendanceType'] = 'حضوري (Offline)';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams(dataObj)
        })
        .then(() => {
            alert('تم تسجيل حضورك الحضوري بنجاح! شكراً  🌸');
            form.reset();
            submitBtn.style.display = 'block';
            loadingMsg.style.display = 'none';
        })
        .catch(error => {
            console.error('Error!', error);
            alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
            submitBtn.style.display = 'block';
            loadingMsg.style.display = 'none';
        });
    });
</script>

<!-- Firebase ربط جلب العنوان إن احتجت لتحديثه تلقائياً -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDHTP2bIb6umCwJiMlLTYsM7gBTrXBxao4",
        authDomain: "biomed-hub.firebaseapp.com",
        projectId: "biomed-hub",
        storageBucket: "biomed-hub.firebasestorage.app",
        messagingSenderId: "780975186763",
        appId: "1:780975186763:web:36411ce118e70749d37ece"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function fetchCurrentWorkshopTitle() {
        try {
            const titleDocRef = doc(db, "settings", "current_workshop_title");
            const titleSnap = await getDoc(titleDocRef);
            if (titleSnap.exists() && titleSnap.data().title) {
                document.getElementById('workshopTitle').innerText = 'استمارة حضور ورشة: ' + titleSnap.data().title;
            }
        } catch (error) {
            console.log("Error loading workshop title from Firebase:", error);
        }
    }

    fetchCurrentWorkshopTitle();
</script>
