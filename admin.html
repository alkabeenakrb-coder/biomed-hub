<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - BioMed Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; padding: 30px 15px; margin: 0; color: #333; }
        .container { max-width: 650px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #eaeaea; margin-bottom: 20px; }
        h2 { color: #581c87; margin-top: 0; font-size: 20px; border-bottom: 2px solid #f3e8ff; padding-bottom: 10px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; }
        button { background-color: #6366f1; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #4f46e5; }
        .btn-edit { background-color: #3b82f6; margin-top: 5px; }
        .btn-edit:hover { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; margin-top: 5px; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-cancel { background-color: #6b7280; margin-top: 5px; }
        .btn-cancel:hover { background-color: #4b5563; }
        .msg { margin-top: 10px; color: green; font-weight: bold; font-size: 13px; text-align: center; }
        .hidden { display: none; }
        .workshop-item { background: #fdfcff; border: 1px solid #e9d5ff; padding: 15px; border-radius: 10px; margin-bottom: 12px; position: relative; }
        .workshop-item h4 { margin: 0 0 5px 0; color: #581c87; }
        .workshop-item p { margin: 3px 0; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. شاشة تسجيل الدخول -->
        <div class="card" id="loginCard">
            <h2>تسجيل الدخول للإدارة</h2>
            <p style="color: #666; font-size: 13px;">أدخل رمز المرور للوصول إلى لوحة التحكم.</p>
            <input type="password" id="passwordInput" placeholder="أدخل رمز المرور...">
            <button onclick="checkPassword()">دخول</button>
            <p id="loginMsg" style="color: red; margin-top: 10px; text-align: center;"></p>
        </div>

        <!-- 2. لوحة التحكم الرئيسية (مخفية لحين الدخول) -->
        <div id="adminCard" class="hidden">
            
            <!-- قسم ورشة الحضور الحالية -->
            <div class="card">
                <h2>عنوان ورشة الحضور الحالية</h2>
                <label>عنوان الورشة الذي يظهر في الاستمارة:</label>
                <input type="text" id="titleInput" placeholder="مثال: ورشة أساسيات البورد الإلكتروني...">
                <button onclick="saveNewTitle()">حفظ عنوان ورشة الحضور</button>
                <p id="msgTitle" class="msg"></p>
            </div>

            <!-- قسم إضافة / تعديل ورشة أو أرشيف -->
            <div class="card">
                <h2 id="formTitleText">إضافة ورشة جديدة / أرشيف</h2>
                
                <input type="hidden" id="editId" value="">

                <label>نوع الحالة:</label>
                <select id="wType" onchange="toggleLinkField()">
                    <option value="next">ورشة جديدة / قادمة (Next)</option>
                    <option value="archived">أرشيف (Archived)</option>
                </select>

                <label>عنوان الورشة (title):</label>
                <input type="text" id="wTitle" placeholder="عنوان الورشة...">

                <label>المحاضر (speaker):</label>
                <input type="text" id="wSpeaker" placeholder="تقديم المهندس...">

                <label>التفاصيل (details):</label>
                <textarea id="wDetails" rows="2" placeholder="نبذة مختصرة عن الورشة..."></textarea>

                <label>المنصة / الوقت (platform):</label>
                <input type="text" id="wPlatform" placeholder="Google Meet / الساعة...">

                <!-- حقل الرابط مع حاوية خاصة لإخفائه وإظهاره بسلاسة -->
                <div id="linkContainer">
                    <label>رابط الورشة أو الانضمام (link):</label>
                    <input type="text" id="wLink" placeholder="https://t.me/...">
                </div>

                <button id="submitBtn" onclick="saveWorkshop()">إضافة الورشة للقائمة</button>
                <button id="cancelBtn" class="btn-cancel hidden" onclick="resetForm()" style="margin-top: 8px;">إلغاء التعديل</button>
                <p id="msgWorkshop" class="msg"></p>
            </div>

            <!-- قسم عرض الورش المحفوظة -->
            <div class="card">
                <h2>الورش المضافة حالياً</h2>
                <div id="workshopsList"></div>
            </div>

        </div>
    </div>

    <script>
        // *** رمز المرور الخاص بك ***
        const secretPassword = "biomed2026"; 

        function checkPassword() {
            const enteredPass = document.getElementById('passwordInput').value;
            if (enteredPass === secretPassword) {
                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('adminCard').classList.remove('hidden');
                loadAdminData();
            } else {
                document.getElementById('loginMsg').innerText = 'رمز المرور غير صحيح! ❌';
            }
        }

        function loadAdminData() {
            const savedTitle = localStorage.getItem('workshop_title_key');
            if (savedTitle) {
                document.getElementById('titleInput').value = savedTitle;
            }
            renderWorkshops();
        }

        function saveNewTitle() {
            const newTitle = document.getElementById('titleInput').value;
            if (!newTitle.trim()) {
                alert('الرجاء كتابة العنوان أولاً!');
                return;
            }
            localStorage.setItem('workshop_title_key', newTitle);
            const msg = document.getElementById('msgTitle');
            msg.innerText = 'تم حفظ عنوان ورشة الحضور بنجاح! 🎉';
            setTimeout(() => msg.innerText = '', 3000);
        }

        // دالة لإخفاء أو إظهار حقل الرابط بناءً على نوع الحالة المختار
        function toggleLinkField() {
            const type = document.getElementById('wType').value;
            const linkContainer = document.getElementById('linkContainer');
            if (type === 'archived') {
                linkContainer.classList.add('hidden');
                document.getElementById('wLink').value = ''; // تفريغ الرابط إذا تم تحويله لأرشيف
            } else {
                linkContainer.classList.remove('hidden');
            }
        }

        function getWorkshops() {
            let list = localStorage.getItem('biomed_workshops_list');
            return list ? JSON.parse(list) : [];
        }

        function saveWorkshop() {
            const editId = document.getElementById('editId').value;
            const type = document.getElementById('wType').value;
            const title = document.getElementById('wTitle').value;
            const speaker = document.getElementById('wSpeaker').value;
            const details = document.getElementById('wDetails').value;
            const platform = document.getElementById('wPlatform').value;
            // إذا كانت أرشيف، نجعل الرابط فارغاً تلقائياً
            const link = type === 'archived' ? '' : document.getElementById('wLink').value;

            if (!title.trim()) {
                alert('الرجاء كتابة عنوان الورشة على الأقل!');
                return;
            }

            let workshops = getWorkshops();

            if (editId) {
                workshops = workshops.map(w => {
                    if (w.id == editId) {
                        return { id: Number(editId), type, title, speaker, details, platform, link };
                    }
                    return w;
                });
                document.getElementById('msgWorkshop').innerText = 'تم تعديل الورشة بنجاح! ✅';
            } else {
                const newW = { id: Date.now(), type, title, speaker, details, platform, link };
                workshops.unshift(newW);
                document.getElementById('msgWorkshop').innerText = 'تمت إضافة الورشة بنجاح! ✅';
            }

            localStorage.setItem('biomed_workshops_list', JSON.stringify(workshops));
            
            resetForm();
            setTimeout(() => document.getElementById('msgWorkshop').innerText = '', 3000);
            renderWorkshops();
        }

        function editWorkshop(id) {
            let workshops = getWorkshops();
            const w = workshops.find(item => item.id === id);
            if (!w) return;

            document.getElementById('editId').value = w.id;
            document.getElementById('wType').value = w.type;
            document.getElementById('wTitle').value = w.title;
            document.getElementById('wSpeaker').value = w.speaker || '';
            document.getElementById('wDetails').value = w.details || '';
            document.getElementById('wPlatform').value = w.platform || '';
            document.getElementById('wLink').value = w.link || '';

            // تحديث إظهار/إخفاء حقل الرابط بناءً على بيانات الورشة المراد تعديلها
            toggleLinkField();

            document.getElementById('formTitleText').innerText = 'تعديل بيانات الورشة';
            document.getElementById('submitBtn').innerText = 'حفظ التعديلات';
            document.getElementById('submitBtn').style.backgroundColor = '#3b82f6';
            document.getElementById('cancelBtn').classList.remove('hidden');

            window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('wType').value = 'next';
            document.getElementById('wTitle').value = '';
            document.getElementById('wSpeaker').value = '';
            document.getElementById('wDetails').value = '';
            document.getElementById('wPlatform').value = '';
            document.getElementById('wLink').value = '';
            toggleLinkField();

            document.getElementById('formTitleText').innerText = 'إضافة ورشة جديدة / أرشيف';
            document.getElementById('submitBtn').innerText = 'إضافة الورشة للقائمة';
            document.getElementById('submitBtn').style.backgroundColor = '#6366f1';
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function deleteWorkshop(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الورشة؟')) return;
            let workshops = getWorkshops();
            workshops = workshops.filter(w => w.id !== id);
            localStorage.setItem('biomed_workshops_list', JSON.stringify(workshops));
            renderWorkshops();
        }

        function renderWorkshops() {
            const container = document.getElementById('workshopsList');
            let workshops = getWorkshops();

            if (workshops.length === 0) {
                container.innerHTML = '<p style="color: #888; text-align: center; font-size: 13px;">لا توجد ورش مضافة محلياً بعد.</p>';
                return;
            }

            container.innerHTML = '';
            workshops.forEach(w => {
                container.innerHTML += `
                    <div class="workshop-item">
                        <h4>${w.title} <span style="font-size: 11px; padding: 2px 6px; background: ${w.type === 'next' ? '#dcfce7' : '#f3f4f6'}; color: ${w.type === 'next' ? '#166534' : '#374151'}; border-radius: 4px;">${w.type === 'next' ? 'ورشة جديدة' : 'أرشيف'}</span></h4>
                        <p><strong>المحاضر:</strong> ${w.speaker || 'غير محدد'}</p>
                        <p><strong>التفاصيل:</strong> ${w.details || 'لا توجد تفاصيل'}</p>
                        <p><strong>المنصة:</strong> ${w.platform || 'غير محدد'}</p>
                        ${w.link ? `<p><strong>الرابط:</strong> <a href="${w.link}" target="_blank">${w.link}</a></p>` : ''}
                        <button class="btn-edit" onclick="editWorkshop(${w.id})">تعديل الورشة</button>
                        <button class="btn-danger" onclick="deleteWorkshop(${w.id})">حذف هذه الورشة</button>
                    </div>
                `;
            });
        }
    </script>

</body>
