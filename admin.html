<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - BioMed Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; padding: 30px 15px; margin: 0; color: #333; }
        .container { max-width: 650px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #eaeaea; margin-bottom: 20px; }
        h2 { color: #581c87; margin-top: 0; font-size: 20px; border-bottom: 2px solid #f3e8ff; padding-bottom: 10px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; }
        button { background-color: #6366f1; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #4f46e5; }
        .btn-edit { background-color: #3b82f6; margin-top: 5px; }
        .btn-edit:hover { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; margin-top: 5px; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-cancel { background-color: #6b7280; margin-top: 5px; }
        .btn-cancel:hover { background-color: #4b5563; }
        .msg { margin-top: 10px; color: green; font-weight: bold; font-size: 13px; text-align: center; }
        .hidden { display: none; }
        .workshop-item { background: #fdfcff; border: 1px solid #e9d5ff; padding: 15px; border-radius: 10px; margin-bottom: 12px; position: relative; }
        .workshop-item h4 { margin: 0 0 5px 0; color: #581c87; }
        .workshop-item p { margin: 3px 0; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. شاشة تسجيل الدخول -->
        <div class="card" id="loginCard">
            <h2>تسجيل الدخول للإدارة</h2>
            <p style="color: #666; font-size: 13px;">أدخل رمز المرور للوصول إلى لوحة التحكم.</p>
            <input type="password" id="passwordInput" placeholder="أدخل رمز المرور...">
            <button id="loginBtn">دخول</button>
            <p id="loginMsg" style="color: red; margin-top: 10px; text-align: center;"></p>
        </div>

        <!-- 2. لوحة التحكم الرئيسية (مخفية لحين الدخول) -->
        <div id="adminCard" class="hidden">
            
            <div style="text-align: left; margin-bottom: 10px;">
                <button id="logoutBtn" style="background-color: #6b7280; width: auto; padding: 6px 15px; font-size: 12px;">تسجيل الخروج 🚪</button>
            </div>

            <div class="card">
                <h2>عنوان ورشة الحضور الحالية</h2>
                <label>عنوان الورشة الذي يظهر في الاستمارة:</label>
                <input type="text" id="titleInput" placeholder="مثال: ورشة أساسيات البورد الإلكتروني...">
                <button id="saveTitleBtn">حفظ عنوان ورشة الحضور</button>
                <p id="msgTitle" class="msg"></p>
            </div>

            <div class="card">
                <h2 id="formTitleText">إضافة ورشة جديدة / أرشيف</h2>
                
                <input type="hidden" id="editId" value="">

                <label>نوع الحالة:</label>
                <select id="wType">
                    <option value="next">ورشة جديدة / قادمة (Next)</option>
                    <option value="in-person">حضوري (In-Person)</option>
                    <option value="archived">أرشيف (Archived)</option>
                </select>

                <label>عنوان الورشة (title):</label>
                <input type="text" id="wTitle" placeholder="عنوان الورشة...">

                <label>المحاضر (speaker):</label>
                <input type="text" id="wSpeaker" placeholder="تقديم المهندس...">

                <label>التفاصيل (details):</label>
                <textarea id="wDetails" rows="2" placeholder="نبذة مختصرة عن الورشة..."></textarea>

                <!-- حقول الورشة الحضورية -->
                <div id="inPersonContainer" class="hidden">
                    <label>المحافظة:</label>
                    <input type="text" id="wGovernorate" placeholder="مثال: كربلاء المقدسة / بغداد / نينوى...">

                    <label>موقع الورشة:</label>
                    <input type="text" id="wLocation" placeholder="مثال: نقابة المهندسين - فرع بابل / دائرة الرعاية العلمية...">

                    <label>تاريخ ووقت الورشة:</label>
                    <input type="text" id="wDateTime" placeholder="مثال: السبت 22/11/2026 - الساعة 10:00 صباحاً">
                </div>

                <!-- حقل الورشة الأونلاين / الأرشيف -->
                <div id="platformContainer">
                    <label>المنصة / الوقت (platform):</label>
                    <input type="text" id="wPlatform" placeholder="Google Meet / الساعة...">
                </div>

                <div id="linkContainer">
                    <label>رابط الورشة أو الانضمام (link):</label>
                    <input type="text" id="wLink" placeholder="https://t.me/...">
                </div>

                <button id="submitBtn">إضافة الورشة للقائمة</button>
                <button id="cancelBtn" class="btn-cancel hidden" style="margin-top: 8px;">إلغاء التعديل</button>
                <p id="msgWorkshop" class="msg"></p>
            </div>

            <div class="card">
                <h2>الورش المضافة حالياً</h2>
                <div id="workshopsList">جاري جلب الورش...</div>
            </div>

            <!-- قسم إدارة تغطية المعارض والمؤتمرات والورش -->
            <div class="card">
                <h2 id="postFormTitleText">إضافة تغطية معرض / مؤتمر / ورشة</h2>

                <input type="hidden" id="editPostId" value="">

                <label>نوع التغطية:</label>
                <select id="pTag">
                    <option value="معرض">معرض</option>
                    <option value="مؤتمر">مؤتمر</option>
                    <option value="ورشة">ورشة</option>
                </select>

                <label>عنوان التغطية:</label>
                <input type="text" id="pTitle" placeholder="مثال: تغطية مشاركة BioMed Hub في معرض بغداد الدولي...">

                <label>رابط الصورة (اختياري):</label>
                <input type="text" id="pImageUrl" placeholder="https://...">

                <label>تفاصيل التغطية:</label>
                <textarea id="pBody" rows="3" placeholder="اكتب ملخص الفعالية أو التغطية..."></textarea>

                <button id="submitPostBtn">نشر التغطية</button>
                <button id="cancelPostBtn" class="btn-cancel hidden" style="margin-top: 8px;">إلغاء التعديل</button>
                <p id="msgPost" class="msg"></p>
            </div>

            <div class="card">
                <h2>التغطيات المنشورة حالياً</h2>
                <div id="postsList">جاري جلب التغطيات...</div>
            </div>

        </div>
    </div>

    <!-- برمجة الصفحة المستقرة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHTP2bIb6umCwJiMlLTYsM7gBTrXBxao4",
            authDomain: "biomed-hub.firebaseapp.com",
            projectId: "biomed-hub",
            storageBucket: "biomed-hub.firebasestorage.app",
            messagingSenderId: "780975186763",
            appId: "1:780975186763:web:36411ce118e70749d37ece"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase error:", e);
        }

        const secretPassword = "biomed2026";
        let localWorkshops = [];
        let localPosts = [];

        const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // التحقق عند التحميل
        if (localStorage.getItem('biomed_admin_logged') === 'true') {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminCard').classList.remove('hidden');
            if (db) loadAdminData();
        }

        // ربط الأحداث بالأزرار برمجياً لتجنب أي تعليق
        document.getElementById('loginBtn').addEventListener('click', checkPassword);
        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('biomed_admin_logged');
            location.reload();
        });
        document.getElementById('saveTitleBtn').addEventListener('click', saveNewTitle);
        document.getElementById('wType').addEventListener('change', toggleTypeFields);
        document.getElementById('submitBtn').addEventListener('click', saveWorkshop);
        document.getElementById('cancelBtn').addEventListener('click', resetForm);

        document.getElementById('submitPostBtn').addEventListener('click', savePost);
        document.getElementById('cancelPostBtn').addEventListener('click', resetPostForm);

        function checkPassword() {
            const enteredPass = document.getElementById('passwordInput').value;
            if (enteredPass === secretPassword) {
                localStorage.setItem('biomed_admin_logged', 'true');
                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('adminCard').classList.remove('hidden');
                if (db) loadAdminData();
            } else {
                document.getElementById('loginMsg').innerText = 'رمز المرور غير صحيح! ❌';
            }
        }

        async function loadAdminData() {
            try {
                const titleDocRef = doc(db, "settings", "current_workshop_title");
                const titleSnap = await getDoc(titleDocRef);
                if (titleSnap.exists()) {
                    document.getElementById('titleInput').value = titleSnap.data().title || '';
                }
            } catch (error) {
                console.log("Error loading title:", error);
            }
            toggleTypeFields();
            renderWorkshops();
            renderPosts();
        }

        async function saveNewTitle() {
            if (!db) return;
            const newTitle = document.getElementById('titleInput').value;
            if (!newTitle.trim()) {
                alert('الرجاء كتابة العنوان أولاً!');
                return;
            }
            try {
                await setDoc(doc(db, "settings", "current_workshop_title"), { title: newTitle });
                const msg = document.getElementById('msgTitle');
                msg.innerText = 'تم حفظ عنوان ورشة الحضور بنجاح! 🎉';
                setTimeout(() => msg.innerText = '', 3000);
            } catch (error) {
                alert('خطأ أثناء الحفظ: ' + error.message);
            }
        }

        function toggleTypeFields() {
            const type = document.getElementById('wType').value;
            const linkContainer = document.getElementById('linkContainer');
            const inPersonContainer = document.getElementById('inPersonContainer');
            const platformContainer = document.getElementById('platformContainer');

            if (type === 'archived') {
                linkContainer.classList.add('hidden');
                document.getElementById('wLink').value = '';
            } else {
                linkContainer.classList.remove('hidden');
            }

            if (type === 'in-person') {
                inPersonContainer.classList.remove('hidden');
                platformContainer.classList.add('hidden');
            } else {
                inPersonContainer.classList.add('hidden');
                platformContainer.classList.remove('hidden');
            }
        }

        async function saveWorkshop() {
            if (!db) return;
            const editId = document.getElementById('editId').value;
            const type = document.getElementById('wType').value;
            const title = document.getElementById('wTitle').value;
            const speaker = document.getElementById('wSpeaker').value;
            const details = document.getElementById('wDetails').value;

            const governorate = type === 'in-person' ? document.getElementById('wGovernorate').value : '';
            const location = type === 'in-person' ? document.getElementById('wLocation').value : '';
            const dateTime = type === 'in-person' ? document.getElementById('wDateTime').value : '';

            const platform = type === 'in-person'
                ? [governorate, location].filter(Boolean).join(' - ')
                : document.getElementById('wPlatform').value;

            const link = type === 'archived' ? '' : document.getElementById('wLink').value;

            if (!title.trim()) {
                alert('الرجاء كتابة عنوان الورشة على الأقل!');
                return;
            }

            const payload = { type, title, speaker, details, governorate, location, dateTime, platform, link };

            try {
                if (editId) {
                    await updateDoc(doc(db, "workshops", editId), payload);
                    document.getElementById('msgWorkshop').innerText = 'تم تعديل الورشة بنجاح! ✅';
                } else {
                    await addDoc(collection(db, "workshops"), {
                        ...payload,
                        createdAt: Date.now()
                    });
                    document.getElementById('msgWorkshop').innerText = 'تمت إضافة الورشة بنجاح! ✅';
                }
                resetForm();
                setTimeout(() => document.getElementById('msgWorkshop').innerText = '', 3000);
                renderWorkshops();
            } catch (error) {
                alert('خطأ أثناء الحفظ: ' + error.message);
            }
        }

        window.editWorkshop = function(id) {
            const w = localWorkshops.find(item => item.id === id);
            if (!w) return;

            document.getElementById('editId').value = w.id;
            document.getElementById('wType').value = w.type;
            document.getElementById('wTitle').value = w.title;
            document.getElementById('wSpeaker').value = w.speaker || '';
            document.getElementById('wDetails').value = w.details || '';
            document.getElementById('wGovernorate').value = w.governorate || '';
            document.getElementById('wLocation').value = w.location || '';
            document.getElementById('wDateTime').value = w.dateTime || '';
            document.getElementById('wPlatform').value = w.platform || '';
            document.getElementById('wLink').value = w.link || '';

            toggleTypeFields();

            document.getElementById('formTitleText').innerText = 'تعديل بيانات الورشة';
            document.getElementById('submitBtn').innerText = 'حفظ التعديلات';
            document.getElementById('submitBtn').style.backgroundColor = '#3b82f6';
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('wType').value = 'next';
            document.getElementById('wTitle').value = '';
            document.getElementById('wSpeaker').value = '';
            document.getElementById('wDetails').value = '';
            document.getElementById('wGovernorate').value = '';
            document.getElementById('wLocation').value = '';
            document.getElementById('wDateTime').value = '';
            document.getElementById('wPlatform').value = '';
            document.getElementById('wLink').value = '';
            toggleTypeFields();

            document.getElementById('formTitleText').innerText = 'إضافة ورشة جديدة / أرشيف';
            document.getElementById('submitBtn').innerText = 'إضافة الورشة للقائمة';
            document.getElementById('submitBtn').style.backgroundColor = '#6366f1';
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        window.deleteWorkshop = async function(id) {
            if (!db) return;
            if (!confirm('هل أنت متأكد من حذف هذه الورشة؟')) return;
            try {
                await deleteDoc(doc(db, "workshops", id));
                renderWorkshops();
            } catch (error) {
                alert('خطأ أثناء الحذف: ' + error.message);
            }
        }

        async function renderWorkshops() {
            const container = document.getElementById('workshopsList');
            container.innerHTML = '<p style="color: #888; text-align: center; font-size: 13px;">جاري تحميل الورش...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "workshops"));
                localWorkshops = [];
                querySnapshot.forEach((docSnap) => {
                    localWorkshops.push({ id: docSnap.id, ...docSnap.data() });
                });

                localWorkshops.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (localWorkshops.length === 0) {
                    container.innerHTML = '<p style="color: #888; text-align: center; font-size: 13px;">لا توجد ورش مضافة بعد.</p>';
                    return;
                }

                const typeLabels = {
                    'next': 'ورشة جديدة',
                    'in-person': 'حضوري',
                    'archived': 'أرشيف'
                };
                const typeColors = {
                    'next': 'background: #dcfce7; color: #166534;',
                    'in-person': 'background: #ede9fe; color: #5b21b6;',
                    'archived': 'background: #f3f4f6; color: #374151;'
                };

                container.innerHTML = '';
                localWorkshops.forEach(w => {
                    const badgeStyle = typeColors[w.type] || typeColors.archived;
                    const badgeText = typeLabels[w.type] || 'أرشيف';
                    const venueText = [w.governorate, w.location].filter(Boolean).join(' - ') || w.platform || 'غير محدد';

                    container.innerHTML += `
                        <div class="workshop-item">
                            <h4>${esc(w.title)} <span style="font-size: 11px; padding: 2px 6px; ${badgeStyle} border-radius: 4px;">${badgeText}</span></h4>
                            <p><strong>المحاضر:</strong> ${esc(w.speaker || 'غير محدد')}</p>
                            <p><strong>التفاصيل:</strong> ${esc(w.details || 'لا توجد تفاصيل')}</p>
                            ${w.type === 'in-person'
                                ? `<p><strong>موقع الورشة:</strong> ${esc(venueText)}</p>
                                   <p><strong>التاريخ والوقت:</strong> ${esc(w.dateTime || 'غير محدد')}</p>`
                                : `<p><strong>المنصة:</strong> ${esc(w.platform || 'غير محدد')}</p>`
                            }
                            ${w.link ? `<p><strong>الرابط:</strong> <a href="${esc(w.link)}" target="_blank">${esc(w.link)}</a></p>` : ''}
                            <button class="btn-edit" onclick="editWorkshop('${w.id}')">تعديل الورشة</button>
                            <button class="btn-danger" onclick="deleteWorkshop('${w.id}')">حذف هذه الورشة</button>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = '<p style="color: red; text-align: center; font-size: 13px;">تعذر عرض الورش.</p>';
            }
        }

        // إدارة تغطية المعارض والمؤتمرات والورش (posts)
        async function savePost() {
            if (!db) return;
            const editPostId = document.getElementById('editPostId').value;
            const tag = document.getElementById('pTag').value;
            const title = document.getElementById('pTitle').value;
            const imageUrl = document.getElementById('pImageUrl').value.trim();
            const body = document.getElementById('pBody').value;

            if (!title.trim() || !body.trim()) {
                alert('الرجاء كتابة عنوان التغطية والتفاصيل!');
                return;
            }

            const payload = { tag, title, imageUrl, body };

            try {
                if (editPostId) {
                    await updateDoc(doc(db, "posts", editPostId), payload);
                    document.getElementById('msgPost').innerText = 'تم تعديل التغطية بنجاح! ✅';
                } else {
                    await addDoc(collection(db, "posts"), {
                        ...payload,
                        createdAt: Date.now()
                    });
                    document.getElementById('msgPost').innerText = 'تم نشر التغطية بنجاح! ✅';
                }
                resetPostForm();
                setTimeout(() => document.getElementById('msgPost').innerText = '', 3000);
                renderPosts();
            } catch (error) {
                alert('خطأ أثناء حفظ التغطية: ' + error.message);
            }
        }

        window.editPost = function(id) {
            const p = localPosts.find(item => item.id === id);
            if (!p) return;

            document.getElementById('editPostId').value = p.id;
            document.getElementById('pTag').value = p.tag || 'معرض';
            document.getElementById('pTitle').value = p.title || '';
            document.getElementById('pImageUrl').value = p.imageUrl || '';
            document.getElementById('pBody').value = p.body || '';

            document.getElementById('postFormTitleText').innerText = 'تعديل التغطية';
            document.getElementById('submitPostBtn').innerText = 'حفظ تعديلات التغطية';
            document.getElementById('submitPostBtn').style.backgroundColor = '#3b82f6';
            document.getElementById('cancelPostBtn').classList.remove('hidden');
            document.getElementById('postFormTitleText').scrollIntoView({ behavior: 'smooth' });
        }

        function resetPostForm() {
            document.getElementById('editPostId').value = '';
            document.getElementById('pTag').value = 'معرض';
            document.getElementById('pTitle').value = '';
            document.getElementById('pImageUrl').value = '';
            document.getElementById('pBody').value = '';

            document.getElementById('postFormTitleText').innerText = 'إضافة تغطية معرض / مؤتمر / ورشة';
            document.getElementById('submitPostBtn').innerText = 'نشر التغطية';
            document.getElementById('submitPostBtn').style.backgroundColor = '#6366f1';
            document.getElementById('cancelPostBtn').classList.add('hidden');
        }

        window.deletePost = async function(id) {
            if (!db) return;
            if (!confirm('هل أنت متأكد من حذف هذه التغطية؟')) return;
            try {
                await deleteDoc(doc(db, "posts", id));
                renderPosts();
            } catch (error) {
                alert('خطأ أثناء الحذف: ' + error.message);
            }
        }

        async function renderPosts() {
            const container = document.getElementById('postsList');
            if (!container) return;
            container.innerHTML = '<p style="color: #888; text-align: center; font-size: 13px;">جاري تحميل التغطيات...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                localPosts = [];
                querySnapshot.forEach((docSnap) => {
                    localPosts.push({ id: docSnap.id, ...docSnap.data() });
                });

                localPosts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (localPosts.length === 0) {
                    container.innerHTML = '<p style="color: #888; text-align: center; font-size: 13px;">لا توجد تغطيات منشورة بعد.</p>';
                    return;
                }

                container.innerHTML = '';
                localPosts.forEach(p => {
                    container.innerHTML += `
                        <div class="workshop-item">
                            <h4>${esc(p.title)} <span style="font-size: 11px; padding: 2px 6px; background: #ede9fe; color: #5b21b6; border-radius: 4px;">${esc(p.tag || 'تغطية')}</span></h4>
                            <p>${esc(p.body || '')}</p>
                            ${p.imageUrl ? `<p><strong>الصورة:</strong> <a href="${esc(p.imageUrl)}" target="_blank">عرض الصورة</a></p>` : ''}
                            <button class="btn-edit" onclick="editPost('${p.id}')">تعديل التغطية</button>
                            <button class="btn-danger" onclick="deletePost('${p.id}')">حذف التغطية</button>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = '<p style="color: red; text-align: center; font-size: 13px;">تعذر عرض التغطيات.</p>';
            }
        }
    </script>
</body>
</html>
