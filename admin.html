<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الورش - BioMed Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; padding: 50px 20px; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #eaeaea; display: inline-block; width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { color: #581c87; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin: 15px 0; font-size: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #6366f1; }
        button { background-color: #6366f1; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #4f46e5; }
        #msg { margin-top: 15px; font-weight: bold; font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div class="card" id="loginCard">
        <h2>تسجيل الدخول للإدارة</h2>
        <p style="color: #666; font-size: 13px; margin-bottom: 10px;">أدخل رمز المرور للوصول إلى لوحة التحكم.</p>
        <input type="password" id="passwordInput" placeholder="أدخل رمز المرور...">
        <button onclick="checkPassword()">دخول</button>
        <p id="loginMsg" style="color: red; margin-top: 15px;"></p>
    </div>

    <!-- 2. لوحة التحكم (مخفية لحين إدخال الرمز الصحيح) -->
    <div class="card hidden" id="adminCard">
        <h2>تغيير عنوان الورشة</h2>
        <p style="color: #666; font-size: 13px; margin-bottom: 10px;">اكتب عنوان الورشة الجديد ليظهر مباشرة في استمارة الحضور.</p>
        <input type="text" id="titleInput" placeholder="مثال: ورشة أساسيات البورد الإلكتروني...">
        <button onclick="saveNewTitle()">حفظ العنوان</button>
        <p id="msg" style="color: green;"></p>
    </div>

    <script>
        // *** ضع رمز المرور الخاص بك هنا بين القوسين ***
        const secretPassword = "biomed2026"; 

        function checkPassword() {
            const enteredPass = document.getElementById('passwordInput').value;
            if (enteredPass === secretPassword) {
                // إذا كان الرمز صحيحاً، أخفِ شاشة الدخول وأظهر لوحة التحكم
                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('adminCard').classList.remove('hidden');
                
                // جلب العنوان الحالي في المربع عند فتح اللوحة
                const savedTitle = localStorage.getItem('workshop_title_key');
                if (savedTitle) {
                    document.getElementById('titleInput').value = savedTitle;
                }
            } else {
                document.getElementById('loginMsg').innerText = 'رمز المرور غير صحيح! ❌';
            }
        }

        function saveNewTitle() {
            const newTitle = document.getElementById('titleInput').value;
            if (!newTitle.trim()) {
                alert('الرجاء كتابة العنوان أولاً!');
                return;
            }

            // حفظ العنوان في الذاكرة المشتركة
            localStorage.setItem('workshop_title_key', newTitle);
            
            const msgElem = document.getElementById('msg');
            msgElem.innerText = 'تم تغيير العنوان بنجاح! 🎉';
            setTimeout(() => {
                msgElem.innerText = '';
            }, 3000);
        }
    </script>

</body>
</html>
