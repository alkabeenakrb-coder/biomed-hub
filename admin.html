<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | BioMed Hub</title>
    <link rel="icon" type="image/png" href="M.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: { 50: '#f5f3ff', 100: '#ede9fe', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95' }
                    }
                }
            }
        }
    </script>
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-purple-50/30 text-slate-800 antialiased min-h-screen flex flex-col">

    <main id="loginCard" class="flex-1 flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl border border-purple-200 p-8 sm:p-10 shadow-xl shadow-purple-900/5 max-w-md w-full space-y-6 relative overflow-hidden">
            <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-purple-600 via-purple-800 to-purple-600"></div>
            <div class="text-center space-y-3">
                <div class="w-16 h-16 bg-purple-50 border border-purple-100 rounded-2xl flex items-center justify-center mx-auto p-2.5 shadow-sm">
                    <img src="M.png" alt="BioMed Hub" class="w-full h-full object-contain">
                </div>
                <div>
                    <span class="bg-purple-100 text-purple-800 text-[11px] font-extrabold px-3 py-1 rounded-full inline-block mb-1.5">
                        <i class="fa-solid fa-shield-halved ml-1"></i> بوابة الإدارة المحمية
                    </span>
                    <h1 class="text-2xl font-black text-purple-900">تسجيل الدخول للإدارة</h1>
                </div>
            </div>
            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">البريد الإلكتروني للإدارة *</label>
                    <input type="email" id="adminEmail" required dir="ltr" placeholder="mujtaba.mm85@gmail.com"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-purple-600 outline-none text-sm text-left">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور *</label>
                    <input type="password" id="adminPassword" required dir="ltr" placeholder="••••••••"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-purple-600 outline-none text-sm text-left">
                </div>
                <p id="loginMsg" class="hidden text-xs text-red-600 font-bold text-center bg-red-50 border border-red-100 py-2.5 px-3 rounded-xl"></p>
                <button type="submit" id="loginBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3.5 rounded-xl text-sm font-extrabold transition shadow-md shadow-purple-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> <span>دخول إلى لوحة التحكم</span>
                </button>
            </form>
        </div>
    </main>

    <div id="adminCard" class="hidden flex-1 flex flex-col">
        <nav class="w-full bg-white border-b border-purple-100 py-4 px-6 sticky top-0 z-50 shadow-sm">
            <div class="max-w-5xl mx-auto flex justify-between items-center gap-3 flex-wrap">
                <div class="flex items-center gap-3">
                    <img src="M.png" alt="BioMed Hub" class="w-10 h-10 object-contain">
                    <div>
                        <h1 class="font-extrabold text-lg text-purple-900">BioMed Hub <span class="bg-purple-100 text-purple-800 text-[10px] px-2.5 py-0.5 rounded-full">لوحة الإدارة</span></h1>
                        <p id="admin-user-email-display" class="text-xs text-slate-500 font-medium"></p>
                    </div>
                </div>
                <button id="logoutBtn" type="button" class="bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i> <span>تسجيل الخروج</span>
                </button>
            </div>
        </nav>

        <main class="max-w-5xl w-full mx-auto py-8 px-6 space-y-6 flex-1">
            
            <!-- منشئ الاستمارات الذكي المطور -->
            <section class="bg-white rounded-3xl border border-purple-200 p-6 sm:p-8 shadow-sm space-y-5">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-purple-100 pb-4">
                    <div>
                        <h2 class="text-lg font-black text-purple-900 flex items-center gap-2">
                            <i class="fa-solid fa-wpforms text-purple-600"></i>
                            <span>منشئ الاستمارات الذكي المطور</span>
                        </h2>
                        <p class="text-xs text-slate-500 mt-0.5">أنشئ استمارات مع خيارات متقدمة (نص، بريد، قوائم منسدلة، نعم/لا).</p>
                    </div>
                    <button type="button" id="toggleNewFormBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-xs font-extrabold transition shadow-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> <span>إنشاء استمارة جديدة</span>
                    </button>
                </div>

                <div id="formBuilderPanel" class="hidden bg-purple-50/50 border border-purple-200 rounded-2xl p-5 space-y-4">
                    <h3 class="text-sm font-black text-purple-900 border-b border-purple-200/60 pb-2">تفاصيل الاستمارة والأسئلة</h3>
                    
                    <div class="grid sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">عنوان الاستمارة *</label>
                            <input type="text" id="formTitleInput" placeholder="استمارة ورشة العمل..."
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white focus:border-purple-600 outline-none text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">وصف الاستمارة / التعليمات</label>
                            <input type="text" id="formDescInput" placeholder="يرجى تعبئة الحقول أدناه..."
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white focus:border-purple-600 outline-none text-xs">
                        </div>
                    </div>

                    <div class="space-y-3 pt-2">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-extrabold text-purple-900">أسئلة الاستمارة:</label>
                            <button type="button" id="addQuestionBtn" class="bg-purple-100 hover:bg-purple-200 text-purple-800 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                                <i class="fa-solid fa-circle-plus"></i> إضافة سؤال جديد
                            </button>
                        </div>
                        
                        <div id="questionsContainer" class="space-y-3">
                            <!-- سؤال افتراضي 1 -->
                            <div class="bg-white p-4 rounded-xl border border-purple-100 space-y-2">
                                <div class="flex items-center gap-2">
                                    <input type="text" value="الاسم الثلاثي" class="q-label-input flex-1 px-3 py-2 rounded-lg border border-slate-200 text-xs font-bold" placeholder="نص السؤال...">
                                    <select class="q-type-input px-3 py-2 rounded-lg border border-slate-200 text-xs bg-slate-50 font-bold" onchange="handleQuestionTypeChange(this)">
                                        <option value="text" selected>نص قصير</option>
                                        <option value="email">بريد إلكتروني</option>
                                        <option value="select">خيارات متعددة (قائمة)</option>
                                        <option value="yesno">نعم / لا</option>
                                    </select>
                                    <button type="button" onclick="this.closest('div.bg-white').remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                                <div class="options-wrapper hidden pt-2 border-t border-slate-100">
                                    <label class="block text-[11px] font-bold text-slate-500 mb-1">الخيارات (افصل بينها بفارزة أو سطر جديد، مثلاً: بغداد, كربلاء, بابل):</label>
                                    <input type="text" placeholder="خيار 1, خيار 2, خيار 3" class="q-options-input w-full px-3 py-1.5 rounded-lg border border-slate-200 text-xs">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-purple-200/60">
                        <p id="formMsg" class="text-xs font-bold"></p>
                        <div class="flex items-center gap-2">
                            <button type="button" id="cancelFormBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition">إلغاء</button>
                            <button type="button" id="saveFormBtn" class="bg-purple-700 hover:bg-purple-800 text-white px-6 py-2 rounded-xl text-xs font-extrabold transition shadow-sm">نشر وحفظ الاستمارة</button>
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <h3 class="text-sm font-extrabold text-purple-900 mb-3">الاستمارات النشطة</h3>
                    <div id="formsListContainer" class="grid sm:grid-cols-2 gap-3">
                        <p class="text-slate-400 text-xs col-span-2 text-center py-4">جاري جلب الاستمارات...</p>
                    </div>
                </div>

                <!-- نافذة الردود -->
                <div id="formResponsesModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden border border-purple-100">
                        <div class="p-4 bg-purple-900 text-white flex justify-between items-center">
                            <div>
                                <h3 id="modalFormTitle" class="font-extrabold text-sm">ردود الاستمارة</h3>
                                <p id="modalResponsesCount" class="text-[11px] text-purple-200">0 رد مسجل</p>
                            </div>
                            <button type="button" id="closeModalBtn" class="w-8 h-8 rounded-full bg-purple-800 hover:bg-purple-700 flex items-center justify-center text-white transition">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div id="modalResponsesContent" class="p-6 overflow-y-auto flex-1 space-y-3">
                            <p class="text-center text-xs text-slate-400 py-8">جاري جلب الردود...</p>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHTP2bIb6umCwJiMlLTYsM7gBTrXBxao4",
            authDomain: "biomed-hub.firebaseapp.com",
            projectId: "biomed-hub",
            storageBucket: "biomed-hub.firebasestorage.app",
            messagingSenderId: "780975186763",
            appId: "1:780975186763:web:36411ce118e70749d37ece"
        };

        const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const MASTER_ADMIN = "mujtaba.mm85@gmail.com";

        let localForms = [];
        const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        onAuthStateChanged(auth, async (user) => {
            const loginCard = document.getElementById('loginCard');
            const adminCard = document.getElementById('adminCard');
            const loginMsg = document.getElementById('loginMsg');

            if (user) {
                const email = (user.email || '').toLowerCase();
                let isAuthorized = email === MASTER_ADMIN.toLowerCase();
                if (!isAuthorized) {
                    try {
                        const memberSnap = await getDoc(doc(db, "members", user.uid));
                        if (memberSnap.exists() && memberSnap.data().role === 'admin') isAuthorized = true;
                    } catch (e) {}
                }
                if (!isAuthorized) {
                    await signOut(auth);
                    loginMsg.innerText = 'عذراً، هذا الحساب لا يملك صلاحيات الإدارة المساعدة.';
                    loginMsg.classList.remove('hidden');
                    return;
                }
                loginCard.classList.add('hidden');
                adminCard.classList.remove('hidden');
                document.getElementById('admin-user-email-display').innerText = user.email;
                renderForms();
            } else {
                loginCard.classList.remove('hidden');
                adminCard.classList.add('hidden');
            }
        });

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const msgEl = document.getElementById('loginMsg');
            msgEl.classList.add('hidden');
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                msgEl.innerText = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
                msgEl.classList.remove('hidden');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => await signOut(auth));

        // التحكم بإظهار حقل الخيارات إذا اخترنا Select
        window.handleQuestionTypeChange = function(selectEl) {
            const wrapper = selectEl.closest('.bg-white').querySelector('.options-wrapper');
            if (selectEl.value === 'select') {
                wrapper.classList.remove('hidden');
            } else {
                wrapper.classList.add('hidden');
            }
        };

        const formBuilderPanel = document.getElementById('formBuilderPanel');
        document.getElementById('toggleNewFormBtn').addEventListener('click', () => formBuilderPanel.classList.toggle('hidden'));
        document.getElementById('cancelFormBtn').addEventListener('click', () => formBuilderPanel.classList.add('hidden'));

        document.getElementById('addQuestionBtn').addEventListener('click', () => {
            const container = document.getElementById('questionsContainer');
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-xl border border-purple-100 space-y-2";
            div.innerHTML = `
                <div class="flex items-center gap-2">
                    <input type="text" placeholder="نص السؤال الجديد..." class="q-label-input flex-1 px-3 py-2 rounded-lg border border-slate-200 text-xs font-bold">
                    <select class="q-type-input px-3 py-2 rounded-lg border border-slate-200 text-xs bg-slate-50 font-bold" onchange="handleQuestionTypeChange(this)">
                        <option value="text">نص قصير</option>
                        <option value="email">بريد إلكتروني</option>
                        <option value="select">خيارات متعددة (قائمة)</option>
                        <option value="yesno">نعم / لا</option>
                    </select>
                    <button type="button" onclick="this.closest('div.bg-white').remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="options-wrapper hidden pt-2 border-t border-slate-100">
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">الخيارات (افصل بينها بفارزة، مثل: خيار 1, خيار 2):</label>
                    <input type="text" placeholder="خيار 1, خيار 2" class="q-options-input w-full px-3 py-1.5 rounded-lg border border-slate-200 text-xs">
                </div>
            `;
            container.appendChild(div);
        });

        document.getElementById('saveFormBtn').addEventListener('click', async () => {
            const title = document.getElementById('formTitleInput').value.trim();
            const description = document.getElementById('formDescInput').value.trim();
            const msgEl = document.getElementById('formMsg');

            if (!title) { alert('يرجى كتابة عنوان الاستمارة'); return; }

            const questions = [];
            document.querySelectorAll('#questionsContainer > div').forEach(row => {
                const label = row.querySelector('.q-label-input').value.trim();
                const type = row.querySelector('.q-type-input').value;
                const optionsRaw = row.querySelector('.q-options-input')?.value || '';
                const options = type === 'select' ? optionsRaw.split(',').map(o => o.trim()).filter(Boolean) : [];
                if (label) questions.push({ label, type, options });
            });

            try {
                await addDoc(collection(db, "custom_forms"), { title, description, questions, createdAt: Date.now() });
                msgEl.className = "text-xs font-bold text-emerald-700";
                msgEl.innerText = 'تم نشر الاستمارة بنجاح!';
                document.getElementById('formTitleInput').value = '';
                document.getElementById('formDescInput').value = '';
                formBuilderPanel.classList.add('hidden');
                renderForms();
            } catch (err) {
                msgEl.className = "text-xs font-bold text-red-600";
                msgEl.innerText = 'خطأ: ' + err.message;
            }
        });

        async function renderForms() {
            const container = document.getElementById('formsListContainer');
            try {
                const snap = await getDocs(collection(db, "custom_forms"));
                localForms = [];
                snap.forEach(d => localForms.push({ id: d.id, ...d.data() }));
                localForms.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (!localForms.length) {
                    container.innerHTML = '<p class="text-slate-400 text-xs col-span-2 text-center py-4">لا توجد استمارات نشطة حالياً.</p>';
                    return;
                }

                container.innerHTML = localForms.map(f => `
                    <div class="bg-purple-50/40 border border-purple-100 rounded-2xl p-4 flex flex-col justify-between space-y-3">
                        <div>
                            <span class="bg-purple-100 text-purple-800 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">استمارة تفاعلية</span>
                            <h4 class="font-extrabold text-sm text-purple-900 mt-1.5">${esc(f.title)}</h4>
                            <p class="text-xs text-slate-500 mt-0.5">${esc(f.description || 'بدون وصف')}</p>
                        </div>
                        <div class="flex items-center gap-2 pt-2 border-t border-purple-100/60 flex-wrap">
                            <button type="button" onclick="navigator.clipboard.writeText(window.location.origin + '/form.html?id=${f.id}'); alert('تم نسخ رابط الاستمارة!');" class="bg-white hover:bg-purple-50 text-purple-700 border border-purple-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                                <i class="fa-solid fa-copy"></i> نسخ الرابط
                            </button>
                            <button type="button" onclick="viewFormResponses('${f.id}', '${esc(f.title)}')" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-1.5 rounded-lg text-xs font-extrabold transition">
                                عرض الردود
                            </button>
                            <button type="button" onclick="deleteCustomForm('${f.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1.5 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {}
        }

        window.deleteCustomForm = async function(id) {
            if (!confirm('حذف هذه الاستمارة وكل ردودها؟')) return;
            await deleteDoc(doc(db, "custom_forms", id));
            renderForms();
        };

        window.viewFormResponses = async function(formId, formTitle) {
            const modal = document.getElementById('formResponsesModal');
            const titleEl = document.getElementById('modalFormTitle');
            const countEl = document.getElementById('modalResponsesCount');
            const contentEl = document.getElementById('modalResponsesContent');

            titleEl.innerText = `ردود: ${formTitle}`;
            countEl.innerText = 'جاري التحميل...';
            contentEl.innerHTML = '<p class="text-center text-xs text-slate-400 py-8">جاري جلب الردود...</p>';
            modal.classList.remove('hidden');

            try {
                const snap = await getDocs(collection(db, "custom_forms", formId, "responses"));
                const responses = [];
                snap.forEach(d => responses.push(d.data()));
                countEl.innerText = `${responses.length} رد مسجل حتى الآن`;

                if (!responses.length) {
                    contentEl.innerHTML = '<p class="text-center text-xs text-slate-400 py-8">لا توجد ردود مسجلة حتى الآن.</p>';
                    return;
                }

                contentEl.innerHTML = `
                    <div class="overflow-x-auto">
                        <table class="w-full text-right border-collapse text-xs">
                            <thead>
                                <tr class="bg-purple-50 text-purple-900 border-b border-purple-200">
                                    <th class="p-2.5">وقت التسجيل</th>
                                    ${Object.keys(responses[0].answers || {}).map(k => `<th class="p-2.5">${esc(k)}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${responses.map(r => `
                                    <tr class="hover:bg-purple-50/20">
                                        <td class="p-2.5 text-slate-500 text-[11px]">${new Date(r.submittedAt || Date.now()).toLocaleString('ar-IQ')}</td>
                                        ${Object.values(r.answers || {}).map(val => `<td class="p-2.5 font-bold text-slate-800">${esc(val)}</td>`).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>`;
            } catch (err) {
                contentEl.innerHTML = '<p class="text-center text-xs text-red-500 py-8">تعذر تحميل الردود.</p>';
            }
        };

        document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('formResponsesModal').classList.add('hidden'));
    </script>
</body>
</html>
