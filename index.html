<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioMed Hub | منصة الهندسة الطبية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: { 50: '#f5f3ff', 100: '#ede9fe', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        /* أنيميشن النبض */
        @keyframes biomed-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.7; }
        }
        .animate-biomed-pulse { animation: biomed-pulse 2s infinite ease-in-out; }
        /* أنيميشن موجة القلب */
        @keyframes ecg-move { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }
        .animate-ecg { animation: ecg-move 10s linear infinite; width: 200%; }
    </style>
</head>
<body class="bg-white text-slate-800 antialiased">

    <!-- Navbar -->
    <nav class="w-full bg-white border-b border-purple-100 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="M.png.PNG" alt="BioMed Hub" class="w-10 h-10 object-contain">
                <div>
                    <h1 class="font-extrabold text-lg text-purple-900">BioMed Hub</h1>
                    <p class="text-xs text-purple-600 font-medium">منصة الهندسة الطبية</p>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-6">
                <a href="#steps" class="text-slate-600 hover:text-purple-600 font-bold text-xs transition">كيف تبدأ؟</a>
                <a href="#workshops" class="text-slate-600 hover:text-purple-600 font-bold text-xs transition">الورش التدريبية</a>
                <a href="#services" class="text-slate-600 hover:text-purple-600 font-bold text-xs transition">شنو نقدم؟</a>
                <a href="#contact" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-xl text-xs font-bold transition shadow-sm">تواصل معنا</a>
            </div>
            <button id="menu-btn" class="md:hidden text-purple-900 text-2xl focus:outline-none p-1"><i class="fa-solid fa-bars"></i></button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="py-16 px-6 max-w-4xl mx-auto text-center space-y-6">
        <img src="M.png.PNG" alt="Logo" class="w-36 h-36 mx-auto object-contain">
        <h1 class="text-3xl font-black text-purple-900">مساحة تعليمية وتطويرية لمهندسي وطلبة الهندسة الطبية</h1>
        <p class="text-slate-600 text-base max-w-2xl mx-auto">نهدف لبناء مجتمع مهني بسيط وفعال في مجالات صيانة الأجهزة الطبية والمبيعات.</p>
    </section>

    <!-- Workshops Section -->
    <section id="workshops" class="py-14 px-6 max-w-5xl mx-auto relative overflow-hidden">
        <!-- خلفية موجة ECG -->
        <div class="absolute inset-0 z-0 opacity-[0.05] pointer-events-none">
            <svg viewBox="0 0 1000 200" class="w-full h-full animate-ecg" preserveAspectRatio="none">
                <path d="M0,100 L100,100 L120,60 L140,140 L160,100 L300,100 L320,40 L340,160 L360,100 L500,100 L520,70 L540,130 L560,100 L700,100 L720,50 L740,150 L760,100 L1000,100" fill="none" stroke="#7c3aed" stroke-width="4" />
            </svg>
        </div>

        <div class="relative z-10">
            <div class="text-center mb-10">
                <h2 class="text-2xl font-extrabold text-purple-900">الورش التدريبية</h2>
            </div>
            <div id="workshops-container" class="grid md:grid-cols-2 gap-6">
                <div class="col-span-2 text-center text-slate-400 py-6">جاري التحميل...</div>
            </div>
        </div>
    </section>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTbrHTeoucxGOQshdTp6JGocVcij6l6Xlt7fmSM503WuU0sLOg5uitYBAyZGvyKlcQqp4TFUbTFAoNA/pub?gid=0&single=true&output=csv';

        async function fetchGoogleSheetData() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                parseCSVAndRender(data);
            } catch (error) { console.error(error); }
        }

        function parseCSVAndRender(csvText) {
            const rows = csvText.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"(.*)"$/, '$1')));
            let workshopsHtml = '';
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i];
                if (!cols[0]) continue;
                if (cols[0] === 'next') {
                    workshopsHtml += `
                    <div class="bg-white rounded-3xl border border-purple-100 p-6 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <span class="bg-emerald-100 text-emerald-700 text-[11px] font-bold px-3 py-1 rounded-full flex items-center gap-1">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-biomed-pulse"></span> التسجيل مفتوح
                            </span>
                        </div>
                        <h3 class="text-lg font-black text-purple-900 mb-2">${cols[1]}</h3>
                        <p class="text-xs text-purple-700 font-bold mb-2"><i class="fa-solid fa-user-gear"></i> ${cols[2]}</p>
                        <p class="text-xs text-slate-600 mb-4">${cols[4]}</p>
                        <a href="${cols[4]}" target="_blank" class="block w-full text-center bg-purple-600 text-white text-xs font-bold py-3 rounded-xl">سجل حضورك الآن</a>
                    </div>`;
                }
            }
            document.getElementById('workshops-container').innerHTML = workshopsHtml;
        }
        fetchGoogleSheetData();
    </script>
</body>
</html>
