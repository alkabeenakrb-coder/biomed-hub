<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تسجيل الحضور الخاصة في ورشة عربة التخدير</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="M.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .header-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #eaeaea;
            margin-bottom: 25px;
            text-align: center;
        }
        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
            border-radius: 50%;
            background: #f1f5f9;
            padding: 5px;
        }
        .header-card h1 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #111;
        }
        .header-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #eaeaea;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
            color: #333;
        }
        .required {
            color: #d93025;
            margin-right: 4px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #6366f1;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            cursor: pointer;
        }
        .radio-option input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .submit-btn {
            background-color: #6366f1;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #4f46e5;
        }
        #loadingMsg {
            display: none;
            text-align: center;
            color: #6366f1;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <img src="M.png" alt="BioMed Hub Logo" class="logo-img">
        <h1 id="workshopTitle">استمارة تسجيل الحضور الخاصة في ورشة عربة التخدير</h1>
        <p id="workshopDesc">يرجى ملء الحقول أدناه بدقة لإتمام عملية تسجيل الحضور والحصول على الشهادة.</p>
    </div>

    <div class="form-card">
        <form id="attendanceForm">
            
            <div class="form-group">
                <label><span class="required">*</span> البريد الإلكتروني</label>
                <input type="email" name="email" placeholder="example@gmail.com" required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> الاسم الكامل باللغة الانجليزية (كما سيكتب في الشهادة)</label>
                <input type="text" name="fullName" placeholder="Full Name in English" required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> المحافظة</label>
                <input type="text" name="city" placeholder="مثال: بغداد" required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> الجامعة</label>
                <input type="text" name="university" placeholder="جامعة بغداد" required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> المرحلة</label>
                <input type="text" name="stage" placeholder="مثال: الثالثة / خريج" required 
                       oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')">
            </div>

            <div class="form-group">
                <label><span class="required">*</span> ما هو تقييمك للمحتوى العلمي والمعرفي الذي قُدّم في الورشة؟</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="evaluation" value="ضعيف" required> ضعيف</label>
                    <label class="radio-option"><input type="radio" name="evaluation" value="متوسط"> متوسط</label>
                    <label class="radio-option"><input type="radio" name="evaluation" value="جيد"> جيد</label>
                    <label class="radio-option"><input type="radio" name="evaluation" value="جيد جداً"> جيد جداً</label>
                    <label class="radio-option"><input type="radio" name="evaluation" value="ممتاز"> ممتاز</label>
                </div>
            </div>

            <div class="form-group">
                <label><span class="required">*</span> شنو المواضيع اللي تحب نقدمها في الورش القادمة؟</label>
                <textarea name="futureTopics" rows="3" placeholder="اكتب المقترحات هنا..." required 
                          oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')"></textarea>
            </div>

            <div class="form-group">
                <label><span class="required">*</span> ما هو رأيك في BIOMEDHUB؟ <a href="https://biomedhubiq.com" target="_blank" style="color: #6366f1;">https://biomedhubiq.com</a></label>
                <textarea name="platformFeedback" rows="3" placeholder="رأيك يهمنا..." required 
                          oninvalid="this.setCustomValidity('يرجى ملء هذا الحقل لإتمام الخطوة بنجاح 📋')" oninput="this.setCustomValidity('')"></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">إرسال الحضور</button>
            <div id="loadingMsg">جاري إرسال البيانات وحفظها... ⏳</div>
        </form>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const workshopParam = urlParams.get('workshop');
    const descParam = urlParams.get('desc');

    if (workshopParam) {
        document.getElementById('workshopTitle').innerText = decodeURIComponent(workshopParam);
    }
    if (descParam) {
        document.getElementById('workshopDesc').innerText = decodeURIComponent(descParam);
    }

    // تم دمج الرابط الجديد الخاص بك هنا بدقة
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyiygPTwPHcQNyaB1aF3WG86ep-RDBkHBTpzgkcLVjAnEr7sJVwldCb52QuLUx6rAq-/exec';

    const form = document.getElementById('attendanceForm');
    const submitBtn = document.getElementById('submitBtn');
    const loadingMsg = document.getElementById('loadingMsg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        submitBtn.style.display = 'none';
        loadingMsg.style.display = 'block';

        const formData = new FormData(form);
        const dataObj = {};
        formData.forEach((value, key) => (dataObj[key] = value));
        dataObj['workshopName'] = document.getElementById('workshopTitle').innerText;

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams(dataObj)
        })
        .then(() => {
            alert('تم تسجيل حضورك بنجاح! شكراً لك 🌸');
            form.reset();
            submitBtn.style.display = 'block';
            loadingMsg.style.display = 'none';
        })
        .catch(error => {
            console.error('Error!', error);
            alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
            submitBtn.style.display = 'block';
            loadingMsg.style.display = 'none';
        });
    });
</script>
