<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة التسجيل | BioMed Hub</title>
    <link rel="icon" type="image/png" href="M.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- خط Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-purple-50/40 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- رأس الصفحة -->
    <header class="w-full bg-white border-b border-purple-100 py-4 px-6 shadow-sm">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="M.png" alt="BioMed Hub" class="w-10 h-10 object-contain">
                <span class="font-extrabold text-lg text-purple-900">BioMed Hub</span>
            </div>
            <a href="index.html" class="text-xs font-bold text-purple-700 hover:text-purple-900 transition flex items-center gap-1">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
        </div>
    </header>

    <!-- محتوى الاستمارة -->
    <main class="max-w-2xl w-full mx-auto py-10 px-4 flex-1">
        
        <!-- حالة التحميل أو الخطأ -->
        <div id="loadingState" class="bg-white rounded-3xl border border-purple-200 p-8 text-center shadow-sm space-y-3">
            <i class="fa-solid fa-spinner fa-spin text-purple-600 text-3xl"></i>
            <p class="text-xs text-slate-500 font-bold">جاري تحميل الاستمارة...</p>
        </div>

        <div id="errorState" class="hidden bg-white rounded-3xl border border-red-200 p-8 text-center shadow-sm space-y-3">
            <div class="w-12 h-12 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto text-lg">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h1 class="text-lg font-black text-slate-800">عذراً، الاستمارة غير موجودة</h1>
            <p class="text-xs text-slate-500">قد يكون الرابط غير صحيح أو تم حذف الاستمارة من قبل الإدارة.</p>
            <a href="index.html" class="inline-block bg-purple-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition mt-2">العودة للرئيسية</a>
        </div>

        <!-- بطاقة الاستمارة الفعلية -->
        <div id="formCard" class="hidden bg-white rounded-3xl border border-purple-200 shadow-xl shadow-purple-900/5 overflow-hidden relative">
            <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-purple-600 via-purple-800 to-purple-600"></div>

            <div class="p-6 sm:p-10 border-b border-purple-100 bg-purple-50/20 space-y-2">
                <span class="bg-purple-100 text-purple-800 text-[11px] font-extrabold px-3 py-1 rounded-full inline-block">
                    <i class="fa-solid fa-file-lines ml-1"></i> استمارة تسجيل رسمية
                </span>
                <h1 id="formTitle" class="text-2xl font-black text-purple-900"></h1>
                <p id="formDesc" class="text-xs text-slate-600 leading-relaxed"></p>
            </div>

            <form id="dynamicForm" class="p-6 sm:p-10 space-y-5">
                <div id="formFieldsContainer" class="space-y-4">
                    <!-- يتم توليد الحقول ديناميكياً هنا -->
                </div>

                <p id="formMsg" class="hidden text-xs font-bold text-center py-2.5 px-3 rounded-xl"></p>

                <button type="submit" id="submitFormBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3.5 rounded-xl text-sm font-extrabold transition shadow-md shadow-purple-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>إرسال الرد الآن</span>
                </button>
            </form>

            <!-- رسالة النجاح بعد الإرسال -->
            <div id="successState" class="hidden p-10 text-center space-y-4">
                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-sm">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div>
                    <h2 class="text-xl font-black text-purple-900">تم إرسال ردك بنجاح!</h2>
                    <p class="text-xs text-slate-500 mt-1">شكراً لك لتسجيلك معنا في فعالية BioMed Hub. تم حفظ بياناتك بنجاح.</p>
                </div>
                <button type="button" onclick="window.location.reload();" class="bg-purple-100 hover:bg-purple-200 text-purple-900 px-5 py-2.5 rounded-xl text-xs font-bold transition">
                    إرسال رد آخر
                </button>
            </div>
        </div>
    </main>

    <footer class="py-6 px-6 text-center bg-white border-t border-purple-100">
        <p class="text-slate-400 text-xs">BioMed Hub &copy; 2026 - جميع الحقوق محفوظة</p>
    </footer>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHTP2bIb6umCwJiMlLTYsM7gBTrXBxao4",
            authDomain: "biomed-hub.firebaseapp.com",
            projectId: "biomed-hub",
            storageBucket: "biomed-hub.firebasestorage.app",
            messagingSenderId: "780975186763",
            appId: "1:780975186763:web:36411ce118e70749d37ece"
        };

        const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const formId = urlParams.get('id');

        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const formCard = document.getElementById('formCard');
        const formTitle = document.getElementById('formTitle');
        const formDesc = document.getElementById('formDesc');
        const fieldsContainer = document.getElementById('formFieldsContainer');
        const dynamicForm = document.getElementById('dynamicForm');
        const successState = document.getElementById('successState');
        const formMsg = document.getElementById('formMsg');
        const submitBtn = document.getElementById('submitFormBtn');

        let currentFormSchema = null;

        async function initForm() {
            if (!formId) {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                return;
            }

            try {
                const docSnap = await getDoc(doc(db, "custom_forms", formId));
                if (!docSnap.exists()) {
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                    return;
                }

                currentFormSchema = docSnap.data();
                formTitle.innerText = currentFormSchema.title || 'استمارة تسجيل';
                formDesc.innerText = currentFormSchema.description || '';

                const questions = currentFormSchema.questions || [];
                fieldsContainer.innerHTML = questions.map((q, index) => `
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-slate-700">
                            ${q.label} <span class="text-purple-600">*</span>
                        </label>
                        <input type="${q.type || 'text'}" name="q_${index}" required placeholder="اكتب إجابتك هنا..."
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-purple-600 focus:ring-2 focus:ring-purple-100 outline-none text-sm transition bg-white">
                    </div>
                `).join('');

                loadingState.classList.add('hidden');
                formCard.classList.remove('hidden');
            } catch (err) {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
            }
        }

        dynamicForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentFormSchema) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري الإرسال...</span>';
            formMsg.classList.add('hidden');

            const formData = new FormData(dynamicForm);
            const answers = {};

            currentFormSchema.questions.forEach((q, index) => {
                answers[q.label] = formData.get(`q_${index}`) || '';
            });

            try {
                await addDoc(collection(db, "custom_forms", formId, "responses"), {
                    answers,
                    submittedAt: Date.now()
                });

                dynamicForm.classList.add('hidden');
                successState.classList.remove('hidden');
            } catch (err) {
                formMsg.className = "text-xs font-bold text-red-600 text-center bg-red-50 border border-red-100 py-2.5 px-3 rounded-xl";
                formMsg.innerText = 'حدث خطأ أثناء إرسال الرد: ' + err.message;
                formMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>إرسال الرد الآن</span>';
            }
        });

        initForm();
    </script>
</body>
</html>
